<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#000000">
		<title>Al-Qur'an - Zhyllan Fyllah</title>
		<link rel="stylesheet" href="assets/global.css">
		<link rel="stylesheet" href="assets/icon.css">
		<link rel="stylesheet" href="assets/index.css">
		<link rel="stylesheet" href="assets/menu.css">
		<link rel="icon" type="image/png" href="assets/icon.png">
	</head>
	<body>
		<header class="site-header">
			<div class="container header-inner">
				<a class="brand" href="./">
					<span class="icon icon-book brand-icon" aria-hidden="true"></span>
					<span class="brand-mark">Al-Qur'an</span>
				</a>
				<button class="menu-button" id="menu-button" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
					<span class="icon icon-menu" aria-hidden="true"></span>
				</button>
			</div>
		</header>

		<main class="container">
			<section class="intro">
				<h1 class="intro-title">Baca Al-Qur'an</h1>
				<p class="intro-text">114 surah lengkap dengan terjemahan dan tafsir.</p>
			</section>

			<div class="search" role="search">
				<span class="icon icon-search search-icon" aria-hidden="true"></span>
				<input id="search" type="search" placeholder="Cari surah atau nomor" autocomplete="off" aria-label="Cari surah">
			</div>

			<div class="list-head">
				<span>Daftar surah</span>
				<span class="count" id="result-count"></span>
			</div>

			<ol class="surah-list" id="surah-list"></ol>

			<p class="empty" id="empty" hidden>Surah tidak ditemukan.</p>
		</main>
		<hr>
		<footer><p class="center">Made By <a class="bawah" href="https://zhyllanfyllah.my.id">Zhyllan Fyllah</a></p></footer>
		<script src="assets/global.js"></script>
		<script src="assets/index.js"></script>
		<script src="assets/menu.js"></script>
	</body>
</html>
